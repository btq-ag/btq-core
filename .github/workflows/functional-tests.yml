#
# Run the whole functional test suite. Many tests still fail on master
# (#104), so the job does not use test_runner.py's exit code. It fails
# only when a test fails that is not in test/functional/known_failures.txt.

name: functional-tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: functional-${{ github.workflow }}-${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  functional-tests:
    name: functional tests
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPRESS: "1"
      MAKEJOBS: "-j4"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils ccache python3-zmq \
            libevent-dev libboost-dev libsqlite3-dev libdb++-dev

      # Same configure flags as build-and-address-tests.yml, so this job
      # can start from that job's ccache.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-functional-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-functional-${{ runner.os }}-
            ccache-${{ runner.os }}-

      - name: Configure
        run: |
          ./autogen.sh
          ./configure \
            --disable-bench \
            --disable-fuzz \
            --disable-fuzz-binary \
            --without-gui \
            --with-incompatible-bdb \
            CC="ccache gcc" \
            CXX="ccache g++"

      - name: Build
        run: make $MAKEJOBS

      - name: Run functional tests
        # test_runner.py exits non-zero while known failures remain, so
        # ignore its exit code here. The next step decides pass or fail.
        run: |
          test/functional/test_runner.py --ci --quiet --jobs 8 \
            --tmpdirprefix "$RUNNER_TEMP" --timeout-factor=4 \
            2>&1 | tee "$RUNNER_TEMP/functional.log" || true

      - name: Compare with known failures
        run: python3 ci/test/check_known_failures.py "$RUNNER_TEMP/functional.log" test/functional/known_failures.txt

      - name: Upload test_runner output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-log
          path: ${{ runner.temp }}/functional.log
          if-no-files-found: ignore

      - name: ccache stats
        if: always()
        run: ccache -s || true
