#
# Run the functional suite with --extended: BASE_SCRIPTS plus the slow tests
# in EXTENDED_SCRIPTS. This takes about twice as long as the base suite in
# functional-tests.yml, so it runs on pushes to master, nightly, on manual
# dispatch, and on pull requests labelled ci:extended, not on every pull
# request. The build steps match functional-tests.yml; keep them in step.
# The checker's own unit tests (test_functional_test_harness.py) run only in
# functional-tests.yml.
#
# Adding another label to a pull request that has ci:extended posts a skipped
# result for this check on the same commit, which hides the earlier result in
# the pull request's checks list. Re-run the earlier run from the Actions tab
# to show it again.

name: extended-functional-tests

on:
  push:
    branches: [master]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  # Adding any other label must not cancel a running check.
  group: extended-functional-${{ (github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name != 'ci:extended')) && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  extended-functional-tests:
    name: extended functional tests
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:extended') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci:extended'))
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPRESS: "1"
      MAKEJOBS: "-j4"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils ccache python3-zmq \
            libevent-dev libboost-dev libsqlite3-dev libdb++-dev libzmq3-dev

      - name: Restore ccache
        # Restore only. The configure flags match functional-tests.yml, so
        # its cache serves this job and a second entry per commit would only
        # use up the repository's cache quota.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-functional-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-functional-${{ runner.os }}-
            ccache-${{ runner.os }}-

      - name: Configure
        run: |
          ./autogen.sh
          ./configure \
            --disable-bench \
            --disable-fuzz \
            --disable-fuzz-binary \
            --without-gui \
            --with-incompatible-bdb \
            --with-zmq \
            CC="ccache gcc" \
            CXX="ccache g++"

      - name: Build
        run: make $MAKEJOBS

      - name: Run functional tests
        # Preserve the log even on failure. The next step rejects unexpected
        # failures, incomplete runs, missing variants and missing RPC coverage.
        run: |
          test/functional/test_runner.py --ci --quiet --extended --coverage --jobs 8 \
            --tmpdirprefix "$RUNNER_TEMP" --timeout-factor=4 \
            2>&1 | tee "$RUNNER_TEMP/functional.log" || true

      - name: Compare with known failures
        run: python3 ci/test/check_known_failures.py --extended --coverage "$RUNNER_TEMP/functional.log" test/functional/known_failures.txt

      - name: Upload test_runner output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-functional-log
          path: ${{ runner.temp }}/functional.log
          if-no-files-found: ignore

      - name: ccache stats
        if: always()
        run: ccache -s || true
